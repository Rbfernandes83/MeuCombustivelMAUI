
name: Compilar Meu Combustivel Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar MAUI Android
        run: dotnet workload install maui-android

      - name: Compilar APK
        run: |
          dotnet publish MeuCombustivelMAUI.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuCombustivel-Android
          path: bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error
